<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#e7c86b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e7c86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ingotTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="50%" stop-color="#f0d68a"/>
      <stop offset="100%" stop-color="#e7c86b"/>
    </linearGradient>
    <linearGradient id="ingotFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#a97f21"/>
    </linearGradient>
    <linearGradient id="ingotSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c7420"/>
      <stop offset="100%" stop-color="#7a5814"/>
    </linearGradient>
    <filter id="softGlow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="96" fill="#0b0f19"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#borderGrad3)" stroke-width="6"/>

  <ellipse cx="256" cy="300" rx="150" ry="120" fill="url(#glow3)"/>

  <!-- Radiating spark lines, fanning from upper-right -->
  <g stroke="url(#ingotTop)" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="330" y1="120" x2="368" y2="86"/>
    <line x1="352" y1="150" x2="398" y2="132"/>
    <line x1="360" y1="188" x2="410" y2="182"/>
  </g>

  <!-- Gold ingot / bullion bar, isometric-ish -->
  <g filter="url(#softGlow3)">
    <polygon points="152,268 300,268 360,232 212,232" fill="url(#ingotTop)"/>
    <polygon points="152,268 300,268 300,340 152,340" fill="url(#ingotFront)"/>
    <polygon points="300,268 360,232 360,304 300,340" fill="url(#ingotSide)"/>
    <!-- top highlight strip -->
    <polygon points="182,258 270,258 300,240 212,240" fill="#fffaf0" opacity="0.55"/>
  </g>

  <!-- Breakout arrow rising up through/behind the ingot -->
  <g stroke="#3fb27f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 176 300 L 232 244 L 276 276 L 340 200"/>
    <path d="M 312 200 L 340 200 L 340 228"/>
  </g>
</svg>
