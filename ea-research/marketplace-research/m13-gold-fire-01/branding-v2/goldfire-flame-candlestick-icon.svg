<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e7855e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e7855e" stop-opacity="0"/>
    </radialGradient>
    <!-- Layered flame gradients - back (deep amber) -> mid (gold) -> core (near-white) for depth -->
    <linearGradient id="flameBack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b5701f"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e7c86b"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="55%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#fff2c8"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f0c869"/>
      <stop offset="100%" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="softGlow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="96" fill="#0b0f19"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#borderGrad2)" stroke-width="6"/>

  <ellipse cx="256" cy="230" rx="150" ry="160" fill="url(#glow2)"/>

  <!-- Bullish candlestick, wick through the flame -->
  <line x1="256" y1="128" x2="256" y2="200" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <rect x="224" y="200" width="64" height="130" rx="8" fill="#3fb27f"/>
  <line x1="256" y1="330" x2="256" y2="386" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

  <!-- Layered flame rising from the candle body -->
  <g filter="url(#softGlow2)">
    <path d="M 256 210
             C 208 176 214 128 250 92
             C 236 128 262 134 268 106
             C 292 140 288 182 258 204
             C 300 196 322 168 322 138
             C 348 174 342 224 296 250
             C 320 244 336 226 342 206
             C 350 246 322 288 268 288
             C 220 288 198 254 206 220
             C 210 232 222 240 232 240
             C 210 214 216 182 240 156
             C 230 182 236 200 256 210 Z"
          fill="url(#flameBack)"/>
    <path d="M 256 214
             C 222 188 226 154 250 128
             C 240 152 258 156 262 138
             C 278 162 276 190 256 206
             C 284 200 298 182 300 162
             C 316 186 312 218 282 236
             C 298 232 308 220 312 208
             C 316 234 298 260 262 260
             C 230 260 214 238 220 216
             C 224 224 232 230 240 230
             C 226 212 230 192 246 174
             C 240 192 244 204 256 214 Z"
          fill="url(#flameMid)"/>
    <path d="M 256 220
             C 236 202 238 178 254 158
             C 248 174 260 176 262 164
             C 272 180 270 198 256 210
             C 274 206 282 194 284 182
             C 292 198 288 218 268 228
             C 278 226 284 218 286 210
             C 288 226 276 242 256 242
             C 238 242 228 228 232 214
             C 234 220 240 224 244 224
             C 236 212 238 200 248 188
             C 244 200 246 210 256 220 Z"
          fill="url(#flameCore)"/>
  </g>

  <!-- Ember sparks -->
  <g fill="url(#flameMid)">
    <circle cx="352" cy="150" r="6"/>
    <circle cx="370" cy="190" r="4"/>
    <circle cx="158" cy="170" r="4"/>
  </g>
</svg>
