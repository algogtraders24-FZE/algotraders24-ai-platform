<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#e7855e" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#e7855e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameBack" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b5701f"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e7c86b"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="55%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#fff2c8"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f0c869"/>
      <stop offset="100%" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="softGlow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#bg2)"/>
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="url(#borderGrad2)" stroke-width="6"/>

  <ellipse cx="256" cy="176" rx="130" ry="140" fill="url(#glow2)"/>

  <!-- Bullish candlestick, wick through the flame -->
  <line x1="256" y1="94" x2="256" y2="152" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <rect x="230" y="152" width="52" height="102" rx="7" fill="#3fb27f"/>
  <line x1="256" y1="254" x2="256" y2="298" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>

  <!-- Layered flame rising from the candle body -->
  <g filter="url(#softGlow2)">
    <path d="M 256 166
             C 216 138 221 98 251 68
             C 239 98 261 103 266 79
             C 286 108 283 144 258 163
             C 294 156 313 132 313 106
             C 335 137 330 180 291 202
             C 311 197 325 182 330 165
             C 337 199 313 234 268 234
             C 228 234 209 205 216 176
             C 219 187 229 194 238 194
             C 219 172 224 145 244 122
             C 236 145 241 160 256 166 Z"
          fill="url(#flameBack)"/>
    <path d="M 256 170
             C 227 148 230 118 250 96
             C 241 116 256 119 260 104
             C 273 124 271 148 254 161
             C 277 156 289 141 291 124
             C 304 144 300 172 275 187
             C 288 183 296 173 300 163
             C 303 185 288 207 258 207
             C 232 207 218 188 223 169
             C 226 176 233 181 240 181
             C 228 166 231 149 245 134
             C 240 149 243 159 256 170 Z"
          fill="url(#flameMid)"/>
    <path d="M 256 175
             C 239 160 240 140 254 123
             C 249 137 259 138 261 128
             C 269 141 268 156 256 166
             C 272 163 279 153 280 143
             C 287 156 283 173 267 181
             C 275 179 280 172 282 165
             C 284 178 274 191 258 191
             C 243 191 235 179 238 168
             C 240 173 245 176 249 176
             C 242 166 244 156 253 146
             C 249 156 251 165 256 175 Z"
          fill="url(#flameCore)"/>
  </g>

  <!-- Ember sparks -->
  <g fill="url(#flameMid)">
    <circle cx="340" cy="122" r="5.5"/>
    <circle cx="356" cy="156" r="3.5"/>
    <circle cx="164" cy="140" r="3.5"/>
  </g>

  <!-- Wordmark, poster-style matching the rest of the catalog -->
  <text x="256" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" letter-spacing="1" fill="#ffffff">GOLD FIRE</text>
  <text x="256" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="url(#textGrad2)">v5</text>
  <text x="256" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#94a3b8">RISK-% BREAKOUT · MT5</text>
</svg>
