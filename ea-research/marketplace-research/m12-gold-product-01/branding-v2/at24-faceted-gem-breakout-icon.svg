<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#e7c86b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e7c86b" stop-opacity="0"/>
    </radialGradient>
    <!-- Facet gradients - lightest = top-facing, darkest = under-facing, for a cut-gem shading illusion -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="100%" stop-color="#f0d68a"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#c79a2e"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9c7420"/>
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a97f21"/>
      <stop offset="100%" stop-color="#7a5814"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black surface, rounded square - AT24 icon convention -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="#0b0f19"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <circle cx="256" cy="236" r="150" fill="url(#glow)"/>

  <!-- Dashed resistance line the gem is breaking through -->
  <line x1="90" y1="256" x2="422" y2="256" stroke="#94a3b8" stroke-width="5" stroke-dasharray="12 10" opacity="0.7"/>

  <!-- Faceted gem/crystal, breaking upward through the line -->
  <g filter="url(#softGlow)">
    <polygon points="256,120 320,190 256,220 192,190" fill="url(#facetTop)"/>
    <polygon points="192,190 256,220 256,300 176,258" fill="url(#facetLeft)"/>
    <polygon points="320,190 256,220 256,300 336,258" fill="url(#facetRight)"/>
    <polygon points="176,258 256,300 256,352 214,300" fill="url(#facetBottom)"/>
    <polygon points="336,258 256,300 256,352 298,300" fill="url(#facetBottom)"/>
  </g>

  <!-- Spark accents -->
  <g fill="url(#facetTop)">
    <path d="M 108 168 L 114 182 L 128 188 L 114 194 L 108 208 L 102 194 L 88 188 L 102 182 Z"/>
    <path d="M 396 300 L 400 310 L 410 314 L 400 318 L 396 328 L 392 318 L 382 314 L 392 310 Z"/>
    <circle cx="352" cy="150" r="5"/>
  </g>
</svg>
