<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#171008"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#e7c86b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e7c86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="100%" stop-color="#f0d68a"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#c79a2e"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9c7420"/>
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a97f21"/>
      <stop offset="100%" stop-color="#7a5814"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3d1"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <circle cx="256" cy="188" r="140" fill="url(#glow)"/>

  <!-- Dashed resistance line the gem is breaking through -->
  <line x1="96" y1="204" x2="416" y2="204" stroke="#94a3b8" stroke-width="5" stroke-dasharray="12 10" opacity="0.65"/>

  <!-- Faceted gem/crystal, breaking upward through the line -->
  <g filter="url(#softGlow)">
    <polygon points="256,84 314,146 256,174 198,146" fill="url(#facetTop)"/>
    <polygon points="198,146 256,174 256,246 182,208" fill="url(#facetLeft)"/>
    <polygon points="314,146 256,174 256,246 330,208" fill="url(#facetRight)"/>
    <polygon points="182,208 256,246 256,292 220,246" fill="url(#facetBottom)"/>
    <polygon points="330,208 256,246 256,292 292,246" fill="url(#facetBottom)"/>
  </g>

  <!-- Spark accents -->
  <g fill="url(#facetTop)">
    <path d="M 112 128 L 117 140 L 129 145 L 117 150 L 112 162 L 107 150 L 95 145 L 107 140 Z"/>
    <path d="M 400 240 L 404 250 L 414 254 L 404 258 L 400 268 L 396 258 L 386 254 L 396 250 Z"/>
    <circle cx="352" cy="118" r="4.5"/>
  </g>

  <!-- Wordmark, poster-style matching the rest of the catalog -->
  <text x="256" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="1" fill="#ffffff">AT24</text>
  <text x="256" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5" fill="url(#textGrad)">GOLD RANGE BREAKER</text>
  <text x="256" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#94a3b8">PDH/PDL BREAKOUT · MT5</text>
</svg>
