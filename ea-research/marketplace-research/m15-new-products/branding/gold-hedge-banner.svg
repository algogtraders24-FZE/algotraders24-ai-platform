  <text x="900" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b889b">Source: AT24 M2–M7 Evidence/Validation/Risk engines, real MT5 report, exact position-ID trade pairing. Aggressive multi-position risk is real, not smoothed — see Risk section on the listing page.</text>
