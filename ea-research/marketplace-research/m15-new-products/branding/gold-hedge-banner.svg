    <polygon points="90,152 142,152 142,164 90,164" fill="url(#barFace2)"/>
    <path d="M 100 132 L 120 130 C 108 134, 116 144, 128 140" fill="none" stroke="#3fb27f" stroke-width="4" stroke-linecap="round"/>
    <path d="M 96 116 L 102 128 L 108 116 Z" fill="#3fb27f"/>
    <path d="M 128 116 L 134 128 L 140 116 Z" fill="#d1594a"/>

