<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141a10"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="46%">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff9933" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <ellipse cx="256" cy="176" rx="150" ry="118" fill="url(#glow)"/>

  <!-- opening-range box + breakout candle punching through the top -->
  <g filter="url(#softGlow)">
    <rect x="150" y="130" width="150" height="60" fill="none" stroke="url(#rangeGrad)" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="225" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="1">OPENING RANGE</text>

    <rect x="180" y="150" width="16" height="34" rx="2" fill="#5b7a9c"/>
    <line x1="188" y1="142" x2="188" y2="188" stroke="#5b7a9c" stroke-width="4"/>
    <rect x="215" y="160" width="16" height="24" rx="2" fill="#5b7a9c"/>
    <line x1="223" y1="152" x2="223" y2="192" stroke="#5b7a9c" stroke-width="4"/>

    <rect x="255" y="70" width="20" height="80" rx="3" fill="#3fb27f"/>
    <line x1="265" y1="55" x2="265" y2="160" stroke="#3fb27f" stroke-width="5"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="1" fill="#ffffff">NIFTY</text>
  <text x="256" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="1" fill="url(#rangeGrad)">ALGO PRO</text>
  <text x="256" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#94a3b8">OPENING RANGE BREAKOUT · NSE</text>
</svg>
