<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#171308"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c86b"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="46%">
      <stop offset="0%" stop-color="#f7931a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#f7931a"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="72" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <ellipse cx="256" cy="176" rx="150" ry="118" fill="url(#glow)"/>

  <!-- price grid ladder with buy/sell dots at each level, BTC coin center -->
  <g filter="url(#softGlow)">
    <line x1="120" y1="95" x2="392" y2="95" stroke="#94a3b8" stroke-width="2.5" opacity="0.55"/>
    <line x1="120" y1="130" x2="392" y2="130" stroke="#94a3b8" stroke-width="2.5" opacity="0.55"/>
    <line x1="120" y1="165" x2="392" y2="165" stroke="#94a3b8" stroke-width="2.5" opacity="0.55"/>
    <line x1="120" y1="200" x2="392" y2="200" stroke="#94a3b8" stroke-width="2.5" opacity="0.55"/>
    <line x1="120" y1="235" x2="392" y2="235" stroke="#94a3b8" stroke-width="2.5" opacity="0.55"/>

    <circle cx="150" cy="95" r="7" fill="#3fb27f"/>
    <circle cx="150" cy="165" r="7" fill="#3fb27f"/>
    <circle cx="150" cy="235" r="7" fill="#3fb27f"/>
    <circle cx="150" cy="130" r="7" fill="#ef4444"/>
    <circle cx="150" cy="200" r="7" fill="#ef4444"/>

    <circle cx="290" cy="165" r="42" fill="url(#btcGrad)"/>
    <text x="290" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#2c1a02">B</text>
  </g>

  <!-- Wordmark -->
  <text x="256" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" letter-spacing="1" fill="#ffffff">CRYPTO GRID</text>
  <text x="256" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="1" fill="url(#borderGrad)">BOT</text>
  <text x="256" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#94a3b8">ATR-SIZED GRID · BREAKOUT KILL SWITCH</text>
</svg>
